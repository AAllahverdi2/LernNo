    <circle cx="47" cy="29" r="2.8" fill="#c084fc" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="44" cy="33" r="2.8" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="46" cy="37" r="2.8" fill="#34d399" stroke="#ffffff" stroke-width="1.5"/>

