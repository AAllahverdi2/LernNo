    <circle cx="26" cy="27" r="2.2" fill="#ffffff"/>
    <path d="M26 27L30 30" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="30" cy="30" r="2.2" fill="#38bdf8"/>
    <path d="M30 30L27 36" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="27" cy="36" r="2.2" fill="#ffffff"/>
