    <!-- Right Brain AI Circuit Nodes and Lines -->
    <path d="M30 15C34 15 37 17.5 38 21H43" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    
    <path d="M30 25H41V29H45" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <path d="M31 33H42" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

